<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">

<title>Denkfehler in Diskussionen</title>

<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --ink: #111827;
  --muted: #4B5563;
  --box: #F3F4F6;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #121418; --ink: #E7E9EE; --muted: #A3AAB6; --box: #1E2229; }
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  height: 100%;
  width: 100%;
  container: stage / size;
  /* own swipe and double-tap handling; pinch zoom stays available */
  touch-action: pan-y pinch-zoom;
  user-select: none;
  -webkit-user-select: none;
}

.card {
  /* design canvas: portrait 360x640, landscape 760x400 (see @container below) */
  --W: 360;
  --H: 640;
  --aw: calc(100cqw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  --ah: calc(100cqh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  /* 1 design unit: the whole card fits, capped so desktop text stays sensible */
  --u: min(var(--aw) / var(--W), var(--ah) / var(--H), 1.4px);
  /* per-card fit steps set by script: --fit for all text, --nfit for the name only */
  --fit: 1;
  --nfit: 1;
  --fs-xs: calc(var(--u) * 13 * var(--fit));
  --fs-s: calc(var(--u) * 16 * var(--fit));
  --fs-m: calc(var(--u) * 18 * var(--fit));
  --fs-l: calc(var(--u) * 33 * var(--fit) * var(--nfit));
  --pad: calc(var(--u) * 20);
  --gap: calc(var(--u) * 14 * var(--fit));
  /* content column is centered when the screen is wider than the design canvas */
  --side: max(var(--pad), (var(--aw) - var(--W) * var(--u)) / 2 + var(--pad));
  --gt: var(--g);
  --tint: color-mix(in srgb, var(--g) 9%, var(--bg));
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  .card { --gt: color-mix(in srgb, var(--g) 45%, #FFFFFF); --tint: color-mix(in srgb, var(--g) 16%, var(--bg)); }
}

.head {
  flex: none;
  position: relative;
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 12);
  padding:
    calc(env(safe-area-inset-top, 0px) + var(--u) * 8)
    calc(env(safe-area-inset-right, 0px) + var(--side) - var(--u) * 8)
    calc(var(--u) * 8)
    calc(env(safe-area-inset-left, 0px) + var(--side));
  background: var(--g);
  color: #FFFFFF;
  font-size: var(--fs-s);
  line-height: 1.25;
}
.cat { margin: 0; flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.cat-name { font-weight: 700; }
.pos, .round { font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .9; }
.round { flex: none; }
.share {
  flex: none;
  display: grid;
  place-items: center;
  width: max(40px, var(--u) * 40);
  height: max(40px, var(--u) * 40);
  margin: calc(var(--u) * -4) 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.share svg { width: 55%; height: 55%; display: block; }
.share:hover { background: rgba(255, 255, 255, .16); }
.share:focus-visible { outline: 2px solid #FFFFFF; outline-offset: -2px; }
.flash {
  position: absolute;
  z-index: 1;
  top: calc(100% + var(--u) * 6);
  right: calc(env(safe-area-inset-right, 0px) + var(--side));
  margin: 0;
  padding: .3em .7em;
  border-radius: 4px;
  background: var(--ink);
  color: var(--bg);
  font-size: var(--fs-s);
  font-weight: 600;
  white-space: nowrap;
}

.main {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding:
    calc(var(--u) * 20)
    calc(env(safe-area-inset-right, 0px) + var(--side))
    calc(env(safe-area-inset-bottom, 0px) + var(--u) * 18)
    calc(env(safe-area-inset-left, 0px) + var(--side));
}
.col { display: contents; }
/* spacers share some of the free height, each up to a limit */
.sp { flex: 1 0 var(--gap); max-height: calc(var(--u) * 48); }
.name {
  margin: 0;
  font-size: var(--fs-l);
  line-height: 1.08;
  font-weight: 800;
  letter-spacing: -.015em;
  text-wrap: balance;
}
.def { margin: calc(var(--gap) * .8) 0 0; font-size: var(--fs-m); line-height: 1.4; text-wrap: pretty; }
.note { margin: calc(var(--gap) * .8) 0 0; font-size: var(--fs-s); line-height: 1.38; color: var(--muted); font-style: italic; }
.label {
  margin: 0 0 calc(var(--u) * 6 * var(--fit));
  font-size: var(--fs-xs);
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--gt);
}
.ex {
  padding: calc(var(--u) * 12 * var(--fit)) calc(var(--u) * 14);
  border-left: calc(var(--u) * 4) solid var(--g);
  border-radius: 4px;
  background: var(--box);
}
.ex-lines p { margin: 0; font-size: var(--fs-s); line-height: 1.38; text-wrap: pretty; }
.ex-lines p + p { margin-top: calc(var(--u) * 6 * var(--fit)); }
.ex-lines strong { font-weight: 800; }
/* the reply is a full-width panel at the bottom; it takes the free height left on tall screens */
.counter {
  flex: 1 0 auto;
  margin:
    0
    calc(-1 * (env(safe-area-inset-right, 0px) + var(--side)))
    calc(-1 * (env(safe-area-inset-bottom, 0px) + var(--u) * 18))
    calc(-1 * (env(safe-area-inset-left, 0px) + var(--side)));
  padding:
    calc(var(--u) * 14 * var(--fit))
    calc(env(safe-area-inset-right, 0px) + var(--side))
    calc(env(safe-area-inset-bottom, 0px) + var(--u) * 18)
    calc(env(safe-area-inset-left, 0px) + var(--side));
  border-top: calc(var(--u) * 3) solid var(--g);
  background: var(--tint);
}
.counter-text { margin: 0; font-size: var(--fs-m); line-height: 1.38; font-weight: 600; text-wrap: pretty; }

/* wide screens: two columns on a landscape canvas */
@container stage (min-aspect-ratio: 6 / 5) {
  .card { --W: 760; --H: 400; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: safe center; column-gap: calc(var(--u) * 32); }
  .counter { flex: none; margin: 0; padding: calc(var(--u) * 12 * var(--fit)) calc(var(--u) * 14) calc(var(--u) * 14 * var(--fit)); border-radius: 0 0 4px 4px; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col-b .sp-1 { display: none; }
}

.sr { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: no-preference) {
  .main.in { animation: in .22s ease-out; }
  .main.in-back { animation: in-back .22s ease-out; }
  @keyframes in { from { opacity: .2; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes in-back { from { opacity: .2; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

<main id="stage" aria-describedby="help">
  <p class="sr" id="help">Doppeltippen, nach links wischen, Leertaste, Enter oder Pfeil rechts: nächste Karte. Nach rechts wischen oder Pfeil links: vorige Karte.</p>
  <article class="card" id="card">
    <header class="head">
      <p class="cat"><span class="cat-name" id="cat"></span> <span class="pos" id="pos"></span></p>
      <span class="round" id="seen"></span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      </button>
      <p class="flash" id="flash" role="status" hidden></p>
    </header>
    <div class="main" id="main">
      <div class="col col-a">
        <h1 class="name" id="name"></h1>
        <p class="def" id="def"></p>
        <p class="note" id="note" hidden></p>
      </div>
      <div class="col col-b">
        <div class="sp sp-1"></div>
        <section class="ex">
          <p class="label">Beispiel</p>
          <div class="ex-lines" id="example"></div>
        </section>
        <div class="sp sp-2"></div>
        <section class="counter">
          <p class="label">So sprichst du es an</p>
          <p class="counter-text" id="counter"></p>
        </section>
      </div>
    </div>
  </article>
</main>
<p class="sr" id="live" aria-live="polite"></p>

    ["rosinenpicken", "E", "3 / 5", "Rosinenpicken",

  var seen = {};
  function shuffle(a) {

  function draw(exclude) {
    if (!bag.length) {
      bag = shuffle(CARDS.map(function (_, i) { return i; }));
      // avoid showing the same card twice in a row across a reshuffle
      if (bag[bag.length - 1] === exclude && bag.length > 1) {
        var t = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = t;
      }
    }
    return bag.pop();
  }
  function take(i) {
    // remove a directly opened card from the bag so it does not come up again this round
    var k = bag.indexOf(i);
    if (k !== -1) bag.splice(k, 1);
  }

  // ---- fit: shrink the text of this card only if it does not fit ----
  function overflows(el) {
    return el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
  }
  function tooBig() {
    if (overflows(main)) return true;
    var cols = main.querySelectorAll(".col");
    for (var i = 0; i < cols.length; i++) {
      if (getComputedStyle(cols[i]).display !== "contents" && overflows(cols[i])) return true;
    }
    return false;
  }
  function fit() {
    var s = card.style, name = $("name");
    s.setProperty("--nfit", "1");
    s.setProperty("--fit", "1");
    // a long single word in the name: shrink the name only
    var n = 1;
    while (name.scrollWidth > name.clientWidth + 1 && n > 0.6) {
      n -= 0.04;
      s.setProperty("--nfit", n.toFixed(2));
    }
    // still too tall: shrink all text of this card a little
    var f = 1;
    while (tooBig() && f > 0.6) {
      f -= 0.03;
      s.setProperty("--fit", f.toFixed(2));
    }
    card.setAttribute("data-fit", f.toFixed(2));
    card.setAttribute("data-nfit", n.toFixed(2));
  }
  var fitQueued = false;
  function queueFit() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function () { fitQueued = false; fit(); });
  }
  if (window.ResizeObserver) new ResizeObserver(queueFit).observe(stage);
  else window.addEventListener("resize", queueFit);

  // ---- history for "back" ----
  var history_ = [];
  var pos = -1;

  function render(i, dir) {
    var c = CARDS[i];
    var cat = CATS[c.cat];
    card.style.setProperty("--g", cat.color);
    if (themeMeta) themeMeta.setAttribute("content", cat.color);
    $("cat").textContent = cat.name;
    $("pos").textContent = c.pos;
    $("name").textContent = c.name;
    $("def").textContent = c.def;
    $("note").textContent = c.note;
    $("note").hidden = !c.note;
    var ex = $("example");
    ex.textContent = "";
    c.example.forEach(function (line) {
      var p = document.createElement("p");
      var s = document.createElement("strong");
      s.textContent = line[0] + ":";
      p.appendChild(s);
      p.appendChild(document.createTextNode(" " + line[1]));
      ex.appendChild(p);
    });
    $("counter").textContent = c.counter;
    card.setAttribute("data-id", c.id);

    if (!seen[i]) { seen[i] = true; }
    var n = Object.keys(seen).length;
    var seenEl = $("seen");
    seenEl.textContent = n + " / " + CARDS.length;
    seenEl.setAttribute("aria-label", "Karte " + n + " von " + CARDS.length + " in dieser Runde");
    if (n === CARDS.length) seen = {}; // next card starts a new round count

    $("live").textContent = "Karte: " + c.name + ". " + cat.name + ".";

    if (location.hash.slice(1) !== c.id) {
      try { history.replaceState(null, "", "#" + c.id); } catch (e) {}
    }
    document.title = c.name + " · Denkfehler in Diskussionen";

    fit();

    if (dir) {
      main.classList.remove("in", "in-back");
      void main.offsetWidth;
      main.classList.add(dir > 0 ? "in" : "in-back");
    }
  }

  function push(i, dir) {
    history_ = history_.slice(0, pos + 1);
    history_.push(i);
    pos = history_.length - 1;
    render(i, dir);
  }

  function next() {
    if (pos < history_.length - 1) {
      pos++;
      render(history_[pos], 1);
      return;
    }
    push(draw(history_[pos]), 1);
  }
  function back() {
    if (pos <= 0) return;
    pos--;
    render(history_[pos], -1);
  }

  // ---- keys: Space / Enter / ArrowRight = next, ArrowLeft = back ----
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var onButton = e.target && e.target.closest && e.target.closest("button");
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
    else if ((e.key === " " || e.key === "Enter") && !onButton) { e.preventDefault(); next(); }
  });

  // ---- pointer: double-tap = next, swipe left = next, swipe right = back ----
  var sx = null, sy = null, lastTap = 0, lx = 0, ly = 0;
  stage.addEventListener("pointerdown", function (e) {
    // a second finger (pinch) or a press on the share icon is no tap and no swipe
    if (!e.isPrimary || (e.target.closest && e.target.closest("button"))) {
      sx = sy = null;
      lastTap = 0;
      return;
    }
    sx = e.clientX; sy = e.clientY;
  });
  stage.addEventListener("pointerup", function (e) {
    if (!e.isPrimary) return;
    if (sx === null) { lastTap = 0; return; }
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = sy = null;
    if (Math.abs(dx) >= 50 && Math.abs(dx) >= Math.abs(dy) * 1.5) {
      lastTap = 0;
      if (dx < 0) next(); else back();
      return;
    }
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) { lastTap = 0; return; }
    var t = Date.now();
    if (lastTap && t - lastTap < 350 && Math.abs(e.clientX - lx) < 40 && Math.abs(e.clientY - ly) < 40) {
      lastTap = 0;
      next();
    } else {
      lastTap = t; lx = e.clientX; ly = e.clientY;
    }
  });
  stage.addEventListener("pointercancel", function () { sx = sy = null; lastTap = 0; });
  stage.addEventListener("dblclick", function (e) { e.preventDefault(); });

  // ---- direct links via #id ----
  function fromHash() {
    var id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    return Object.prototype.hasOwnProperty.call(byId, id) ? byId[id] : -1;
  }
  window.addEventListener("hashchange", function () {
    var i = fromHash();
    if (i === -1 || i === history_[pos]) return;
    take(i);
    push(i, 1);
  });

  // ---- share: Web Share API, clipboard as fallback ----
  var flash = $("flash"), flashTimer = null;
  function feedback(msg) {
    flash.textContent = msg;
    flash.hidden = false;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { flash.hidden = true; }, 1800);
  }
  shareBtn.addEventListener("click", function () {
    var c = CARDS[history_[pos]];
    var text = "Denkfehler: " + c.name + " - " + c.def;
    var url = location.href;
    function copy() {
      try {
        navigator.clipboard.writeText(text + " " + url).then(
          function () { feedback("Link kopiert"); },
          function () { feedback("Teilen nicht möglich"); }
        );
      } catch (e) {
        feedback("Teilen nicht möglich");
      }
    }
    if (navigator.share) {
      try {
        navigator.share({ title: c.name, text: text, url: url }).catch(function (err) {
          if (!err || err.name !== "AbortError") copy();
        });
      } catch (e) {
        copy();
      }
    } else {
      copy();
    }
  });

  // ---- start ----
  bag = shuffle(CARDS.map(function (_, i) { return i; }));
  var start = fromHash();
  if (start !== -1) take(start); else start = draw(-1);
  push(start, 0);
})();
</script>
</body>
</html>
