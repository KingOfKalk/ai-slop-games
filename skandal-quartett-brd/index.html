<style>
:root{
  --paper:#E9ECE6;--ink:#1C2321;--muted:#4A5552;--line:#CDD3CC;--empty:#C4CBC4;
  --disp:ui-serif,'New York',Georgia,'Noto Serif',serif;
  --body:'Avenir Next Condensed','sans-serif-condensed','Roboto Condensed',system-ui,-apple-system,Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#171C1B;--ink:#E6EAE4;--muted:#A9B3AE;--line:#39423F;--empty:#3A4340}
}
:root[data-theme="dark"]{--paper:#171C1B;--ink:#E6EAE4;--muted:#A9B3AE;--line:#39423F;--empty:#3A4340}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#stage{height:100%;width:100%;container-type:size;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.card{
  /* 1 Designeinheit: skaliert die 3 Schriftgrößen so, dass alles ohne Scrollen passt */
  --u:min(100cqw / 420, 100cqh / 720);
  --fs-s:calc(var(--u) * 15);--fs-m:calc(var(--u) * 20);--fs-l:calc(var(--u) * 38);
  --pad:calc(var(--u) * 22);
  height:100%;width:100%;display:flex;flex-direction:column;background:var(--paper);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
.head{flex:0 0 auto;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(var(--u)*14) var(--pad)}
.code{font-family:var(--disp);font-weight:700;font-size:var(--fs-l);line-height:1}
.grp{font-size:var(--fs-s);font-weight:600;text-align:right}
.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(var(--u)*16) var(--pad) calc(var(--u)*12);gap:calc(var(--u)*10)}
h1{margin:0;font-family:var(--disp);font-weight:700;font-size:var(--fs-l);line-height:1.08;text-wrap:balance}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:calc(var(--u)*8)}
.person{font-size:var(--fs-m);font-weight:600;line-height:1.2}
.party{flex-shrink:0;font-size:var(--fs-s);font-weight:600;padding:.15em .55em;border:1.5px solid var(--ink)}
p{margin:0;font-size:var(--fs-s);line-height:1.38;text-wrap:pretty}
.kz{font-size:var(--fs-m);font-weight:600;line-height:1.2;color:var(--gt)}
.stats{display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:30% minmax(0,1fr) 14%;align-items:center;column-gap:10px;
  min-height:calc(var(--u)*29);border-top:1px solid var(--line)}
.lbl{font-size:var(--fs-s);color:var(--muted)}
.val{font-family:var(--disp);font-weight:700;font-size:var(--fs-m);text-align:right}
.bar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:calc(var(--u)*3);max-width:calc(var(--u)*170)}
.bar i{display:block;height:calc(var(--u)*10);background:var(--empty)}
.bar i.on{background:var(--g)}
.b{font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:var(--fs-s);color:var(--muted);line-height:1.3}
.foot a{color:var(--muted)}
.hint{flex-shrink:0;text-align:right}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{--gt:color-mix(in srgb,var(--g) 45%,#fff)}}
:root[data-theme="dark"] .card{--gt:color-mix(in srgb,var(--g) 45%,#fff)}
.card{--gt:var(--g)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{--gt:color-mix(in srgb,var(--g) 45%,#fff)}}
@media (prefers-reduced-motion: no-preference){.card.in{animation:in .22s ease-out}@keyframes in{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
(function(){
  var D = JSON.parse(document.getElementById('daten').textContent);
  var stage = document.getElementById('stage');
  var cur = -1;
  var W = [['empoerung','Empörung'],['geld','Geld im Spiel'],['karriere','Karriere-Knick'],['nachhall','Nachhall']];
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function bar(v){var h='';for(var i=0;i<10;i++)h+='<i'+(i<v?' class="on"':'')+'></i>';return '<div class="bar" aria-hidden="true">'+h+'</div>';}
  function render(i){
    var k = D.karten[i], g = D.gruppen[k.code.charAt(0)] || {name:'',farbe:'#4B4F58'};
    var rows = '<div class="row"><div class="lbl">Jahr</div><div class="lbl">älter sticht</div><div class="val">'+esc(k.jahr)+'</div></div>';
    W.forEach(function(w){var v=k.werte[w[0]];rows+='<div class="row"><div class="lbl">'+w[1]+'</div>'+bar(v)+'<div class="val" aria-label="'+w[1]+' '+v+' von 10">'+v+'</div></div>';});
    var link = k.links && k.links[0] ? '<a href="'+esc(k.links[0])+'" target="_blank" rel="noopener">'+esc(k.quelle)+'</a>' : esc(k.quelle);
    stage.innerHTML =
      '<article class="card in" style="--g:'+esc(g.farbe)+'">'+
        '<header class="head"><div class="code">'+esc(k.code)+'</div><div class="grp">'+esc(g.name)+'</div></header>'+
        '<div class="main">'+
          '<div><h1>'+esc(k.titel)+'</h1><div class="who"><div class="person">'+esc(k.person)+'</div><div class="party">'+esc(k.partei)+'</div></div></div>'+
          '<p>'+esc(k.text)+'</p>'+
          '<div class="kz">'+esc(k.kennzahl)+'</div>'+
          '<div class="stats">'+rows+'</div>'+
          '<p><span class="b">Folge: </span>'+esc(k.folge)+'</p>'+
          '<div class="foot"><div>Quelle: '+link+'</div><div class="hint">'+(i+1)+'/'+D.karten.length+'</div></div>'+
        '</div>'+
      '</article>';
    document.title = k.code+' '+k.titel+' | Skandal-Quartett';
    try{ document.querySelector('meta[name=theme-color]').setAttribute('content', g.farbe); }catch(e){}
  }
  function next(){
    var n = D.karten.length; if(!n) return;
    var i; do{ i = Math.floor(Math.random()*n); } while(n>1 && i===cur);
    cur = i; render(i);
  }
  // Doppeltipp (Touch) und Doppelklick (Maus), ohne Doppel-Auslösung
  var last = 0, lx = 0, ly = 0;
  stage.addEventListener('pointerup', function(e){
    if(e.target.closest('a')) return;
    var t = Date.now();
    if(t - last < 350 && Math.abs(e.clientX-lx) < 40 && Math.abs(e.clientY-ly) < 40){ last = 0; next(); }
    else { last = t; lx = e.clientX; ly = e.clientY; }
  });
  stage.addEventListener('dblclick', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); next(); }
  });
  next();
})();
</script>
